<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Batch Rename panel harness</title>
    <style>
      * { box-sizing: border-box; }
      body {
        display: flex;
        flex-wrap: wrap;
        gap: 24px;
        margin: 0;
        padding: 24px;
        background: #101318;
        color: #fff;
        font-family: sans-serif;
      }
      figure { margin: 0; }
      figcaption { margin-bottom: 8px; color: #aab4c2; font-size: 12px; }
      iframe { display: block; border: 1px solid #46505e; background: #242424; }
      .wide { width: 662px; height: 384px; }
      .narrow { width: 320px; height: 640px; }
    </style>
  </head>
  <body>
    <figure>
      <figcaption>662 × 384</figcaption>
      <iframe class="wide" src="../index.html?v=1.0.0" title="Wide panel"></iframe>
    </figure>
    <figure>
      <figcaption>320 × 640</figcaption>
      <iframe class="narrow" src="../index.html?v=1.0.0" title="Narrow panel"></iframe>
    </figure>
  </body>
</html>
